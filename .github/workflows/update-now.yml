name: Update "Now" section

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: update-now
  cancel-in-progress: true

jobs:
  now:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A coleta é determinística: o agente recebe o arquivo pronto e não precisa de shell.
      - name: Collect public activity (last 14 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "users/caiocv18/events/public?per_page=100" --jq "[.[]
            | select(.public and .created_at >= \"$since\")
            | select(.type == \"PushEvent\" or .type == \"CreateEvent\" or .type == \"ReleaseEvent\" or .type == \"PullRequestEvent\")
            | select(.repo.name != \"caiocv18/caiocv18\")
            | {type, repo: .repo.name, at: .created_at,
               commits: [(.payload.commits // [])[] | .message | split(\"\n\")[0]],
               release: (.payload.release.name // null),
               pr: (.payload.pull_request.title // null)}]" > "$RUNNER_TEMP/activity.json"
          echo "events: $(jq length "$RUNNER_TEMP/activity.json")"

      # O agente só edita os dois READMEs; quem abre o PR é o passo seguinte, determinístico.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          display_report: true
          claude_args: |
            --max-turns 12
            --allowedTools Read,Edit
          prompt: |
            You maintain the "Now" section of the GitHub profile README of caiocv18.

            1. Read `${{ runner.temp }}/activity.json`: the public events of caiocv18 from the
               last 14 days (already filtered to public repos, excluding the profile repo).
            2. In README.md, rewrite ONLY the lines between `<!-- NOW:START -->` and
               `<!-- NOW:END -->`. Keep exactly three bullets, same format:
               `- 🔨 **Building:** …`, `- 📚 **Next up:** …`, `- ✍️ **Writing:** …`.
               Each bullet is one line, under 110 characters, plain and factual.
            3. Apply the same change, translated to Brazilian Portuguese with correct accents,
               to README.pt-BR.md (`Construindo`, `Próximos`, `Escrevendo`).
            4. If the public activity does not justify a change, keep a bullet as it is.
               Never invent work. "Next up" only changes when a public study repo shows it.

            Hard rules:
            - Do not touch anything outside the two NOW blocks.
            - Only personal, public work. Never describe work for an employer or client,
              never mention employers, clients, private repositories, ticket numbers or people.
            - Never write "in production". No em dash inside sentences.
            - Do not commit or push; the next workflow step opens the PR.

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-now
          delete-branch: true
          add-paths: |
            README.md
            README.pt-BR.md
          commit-message: "docs: atualiza a seção Now"
          title: "docs: atualiza a seção Now"
          body: |
            Atualização semanal da seção **Now**, gerada a partir da atividade pública dos últimos 14 dias.
            Revise o texto antes do merge.
